name: ERP integration

on:
  push:
    branches:
      - main
      - feat/products-stock-crud
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Test clean start with exactly docker compose up
        shell: bash
        run: |
          set -euo pipefail

          # Comando de inicializacao EXATO exigido para o avaliador.
          # Roda em background apenas porque o modo foreground acompanha os logs.
          docker compose up > compose-up.log 2>&1 &
          up_pid=$!

          show_diagnostics() {
            cat compose-up.log || true
            docker compose ps -a || true
            docker compose logs --no-color --tail=100 || true
          }
          on_exit() {
            result=$?
            if [ "$result" -ne 0 ]; then
              show_diagnostics
            fi
            kill "$up_pid" 2>/dev/null || true
            wait "$up_pid" 2>/dev/null || true
            exit "$result"
          }
          trap on_exit EXIT

          # 'init' e 'ready' sao one-shot; exit 0 e o resultado esperado.
          # Nao usamos --build, --wait ou um segundo comando para subir a aplicacao.
          ready_ok=false
          for attempt in $(seq 1 150); do
            if ! kill -0 "$up_pid" 2>/dev/null; then
              echo "docker compose up encerrou antes da prontidao"
              exit 1
            fi

            ready_id=$(docker compose ps -a -q ready 2>/dev/null || true)
            if [ -n "$ready_id" ]; then
              state=$(docker inspect --format '{{.State.Status}}:{{.State.ExitCode}}' "$ready_id")
              if [ "$state" = "exited:0" ]; then
                ready_ok=true
                break
              fi
              if [[ "$state" == exited:* || "$state" == dead:* ]]; then
                echo "Servico ready falhou: $state"
                exit 1
              fi
            fi
            sleep 2
          done
          if [ "$ready_ok" != true ]; then
            echo "Timeout aguardando o servico ready"
            exit 1
          fi

          init_id=$(docker compose ps -a -q init)
          api_id=$(docker compose ps -q api)
          worker_id=$(docker compose ps -q worker)
          postgres_id=$(docker compose ps -q postgres)
          redis_id=$(docker compose ps -q redis)
          test -n "$init_id"
          test -n "$api_id"
          test -n "$worker_id"
          test -n "$postgres_id"
          test -n "$redis_id"
          test "$(docker inspect --format '{{.State.Status}}:{{.State.ExitCode}}' "$init_id")" = "exited:0"
          test "$(docker inspect --format '{{.State.Health.Status}}' "$api_id")" = "healthy"
          test "$(docker inspect --format '{{.State.Health.Status}}' "$postgres_id")" = "healthy"
          test "$(docker inspect --format '{{.State.Health.Status}}' "$redis_id")" = "healthy"
          test "$(docker inspect --format '{{.State.Status}}' "$worker_id")" = "running"
          docker compose exec -T api python -c "import urllib.request; assert urllib.request.urlopen('http://127.0.0.1:8000/health').status == 200"
          echo "PASSOU: docker compose up inicializou API, banco, Redis, worker, migration e seed"

          # Testes APOS a inicializacao, sem comandos extras para preparar o banco.
          docker compose exec -T postgres psql -U erp -d erp -c 'select count(*) from products;'
          docker compose run --rm --no-deps -v "$PWD/tests:/srv/app/tests:ro" api python -m pytest -q -p no:cacheprovider

          # Reexecutar a seed e migration aqui e somente teste de idempotencia.
          docker compose run --rm init
          docker compose exec -T postgres psql -U erp -d erp -c 'select count(*) from products;'
      - name: Stop containers
        if: always()
        run: docker compose down
